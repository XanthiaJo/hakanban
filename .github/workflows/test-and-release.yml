name: Test and Release

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate (HACS + hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration

  test:
    name: Run Tests
    needs: validate
    runs-on: ubuntu-latest
    # Skip tests on the weekly schedule — only validate runs weekly.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run logic tests
        run: python3 tests/test_logic.py

      - name: Run calendar tests
        run: python3 tests/test_calendar.py

      - name: Run protocol drift test
        run: python3 tests/test_protocol_drift.py

      - name: Run todo entity tests
        run: python3 tests/test_todo.py

  release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest
    if: success() && startsWith(github.event.head_commit.message, 'release:')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate new version
        id: version
        run: |
          # Get the latest version tag
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.1.0"
          fi
          echo "Latest tag: $LATEST_TAG"

          # Parse version components, stripping the leading 'v'
          VERSION=${LATEST_TAG#v}

          # Split into MAJOR.MINOR.PATCH[.REVISION]
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          REVISION=$(echo "$VERSION" | cut -d. -f4)

          # Determine the highest bump priority from commits since the last tag
          BUMP="REVISION"

          for COMMIT in $(git log "$LATEST_TAG"..HEAD --pretty=format:'%H'); do
            MESSAGE=$(git log -1 --pretty=format:'%s%n%b' "$COMMIT")

            # Check for breaking change
            if echo "$MESSAGE" | grep -qiE 'BREAKING CHANGE|!:'; then
              BUMP="MAJOR"
              break
            fi

            # Check commit type
            TYPE=$(echo "$MESSAGE" | head -n 1 | sed -n 's/^\([a-zA-Z]*\)(\([^)]*\))\?!*: .*/\1/p')
            if [ -z "$TYPE" ]; then
              TYPE=$(echo "$MESSAGE" | head -n 1 | sed -n 's/^\([a-zA-Z]*\)\?!*: .*/\1/p')
            fi

            case "$TYPE" in
              feat|perf) [ "$BUMP" != "MAJOR" ] && BUMP="MINOR" ;;
              fix) [ "$BUMP" != "MAJOR" ] && [ "$BUMP" != "MINOR" ] && BUMP="PATCH" ;;
              docs|refactor|test|chore|style|ci|build) ;;
              *) ;;
            esac
          done

          # Bump version
          case "$BUMP" in
            MAJOR)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              REVISION=""
              ;;
            MINOR)
              MINOR=$((MINOR + 1))
              PATCH=0
              REVISION=""
              ;;
            PATCH)
              PATCH=$((PATCH + 1))
              REVISION=""
              ;;
            REVISION)
              if [ -z "$REVISION" ]; then
                REVISION=0
              fi
              REVISION=$((REVISION + 1))
              ;;
          esac

          # Build new version string
          if [ -n "$REVISION" ]; then
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}.${REVISION}"
          else
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Bump type: $BUMP"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update manifest.json version
        run: |
          sed -i 's/"version": ".*"/"version": "${{ steps.version.outputs.new_version }}"/' custom_components/hakanban/manifest.json

      - name: Amend release commit
        run: |
          git add custom_components/hakanban/manifest.json
          git commit --amend -m "release: v${{ steps.version.outputs.new_version }}"
          git push --force-with-lease origin dev

      - name: Create tag
        run: |
          git tag -a "v${{ steps.version.outputs.new_version }}" -m "Release v${{ steps.version.outputs.new_version }}"
          git push origin "v${{ steps.version.outputs.new_version }}"

      - name: Merge dev to main
        run: |
          git checkout main
          git merge dev
          git push origin main

      - name: Create GitHub release
        run: |
          VERSION="v${{ steps.version.outputs.new_version }}"

          # Categorize commits since last tag
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | sed -n '2p')
          [ -z "$LATEST_TAG" ] && LATEST_TAG=$(git rev-list --max-parents=0 HEAD)

          FEATURES=$(git log "$LATEST_TAG"..HEAD --pretty=format:'%s' | grep -E '^feat(\([^)]*\))?!?:' | sed 's/^/- /')
          FIXES=$(git log "$LATEST_TAG"..HEAD --pretty=format:'%s' | grep -E '^fix(\([^)]*\))?!?:' | sed 's/^/- /')
          PERF=$(git log "$LATEST_TAG"..HEAD --pretty=format:'%s' | grep -E '^perf(\([^)]*\))?!?:' | sed 's/^/- /')
          DOCS=$(git log "$LATEST_TAG"..HEAD --pretty=format:'%s' | grep -E '^docs(\([^)]*\))?!?:' | sed 's/^/- /')
          REFACTOR=$(git log "$LATEST_TAG"..HEAD --pretty=format:'%s' | grep -E '^refactor(\([^)]*\))?!?:' | sed 's/^/- /')
          TESTS=$(git log "$LATEST_TAG"..HEAD --pretty=format:'%s' | grep -E '^test(\([^)]*\))?!?:' | sed 's/^/- /')
          CHORE=$(git log "$LATEST_TAG"..HEAD --pretty=format:'%s' | grep -E '^chore(\([^)]*\))?!?:' | sed 's/^/- /')
          CI=$(git log "$LATEST_TAG"..HEAD --pretty=format:'%s' | grep -E '^ci(\([^)]*\))?!?:' | sed 's/^/- /')
          BUILD=$(git log "$LATEST_TAG"..HEAD --pretty=format:'%s' | grep -E '^build(\([^)]*\))?!?:' | sed 's/^/- /')
          STYLE=$(git log "$LATEST_TAG"..HEAD --pretty=format:'%s' | grep -E '^style(\([^)]*\))?!?:' | sed 's/^/- /')

          BODY=""
          append_section() {
            local title="$1"
            local content="$2"
            if [ -n "$content" ]; then
              BODY="${BODY}## ${title}\n\n${content}\n\n"
            fi
          }

          append_section "Features" "$FEATURES"
          append_section "Bug Fixes" "$FIXES"
          append_section "Performance" "$PERF"
          append_section "Documentation" "$DOCS"
          append_section "Refactoring" "$REFACTOR"
          append_section "Tests" "$TESTS"
          append_section "Maintenance" "$CHORE"
          append_section "CI/CD" "$CI"
          append_section "Build" "$BUILD"
          append_section "Style" "$STYLE"

          printf '%s' "$BODY" | gh release create "$VERSION" --title "$VERSION" --notes-file -
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
