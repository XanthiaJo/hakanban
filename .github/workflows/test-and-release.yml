name: Test and Release

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip

      - name: Run logic tests
        run: python3 tests/test_logic.py

      - name: Run calendar tests
        run: python3 tests/test_calendar.py

      - name: Run protocol drift test
        run: python3 tests/test_protocol_drift.py

  release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest
    if: success() && startsWith(github.event.head_commit.message, 'release:')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate new version
        id: version
        run: |
          # Get the latest version tag
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.1.0"
          fi
          echo "Latest tag: $LATEST_TAG"

          # Parse version components, stripping the leading 'v'
          VERSION=${LATEST_TAG#v}

          # Split into MAJOR.MINOR.PATCH[.REVISION]
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          REVISION=$(echo "$VERSION" | cut -d. -f4)

          # Determine the highest bump priority from commits since the last tag
          BUMP="REVISION"

          for COMMIT in $(git log "$LATEST_TAG"..HEAD --pretty=format:'%H'); do
            MESSAGE=$(git log -1 --pretty=format:'%s%n%b' "$COMMIT")

            # Check for breaking change
            if echo "$MESSAGE" | grep -qiE 'BREAKING CHANGE|!:'; then
              BUMP="MAJOR"
              break
            fi

            # Check commit type
            TYPE=$(echo "$MESSAGE" | head -n 1 | sed -n 's/^\([a-zA-Z]*\)(\([^)]*\))\?!*: .*/\1/p')
            if [ -z "$TYPE" ]; then
              TYPE=$(echo "$MESSAGE" | head -n 1 | sed -n 's/^\([a-zA-Z]*\)\?!*: .*/\1/p')
            fi

            case "$TYPE" in
              feat|perf) [ "$BUMP" != "MAJOR" ] && BUMP="MINOR" ;;
              fix) [ "$BUMP" != "MAJOR" ] && [ "$BUMP" != "MINOR" ] && BUMP="PATCH" ;;
              docs|refactor|test|chore|style|ci|build) ;;
              *) ;;
            esac
          done

          # Bump version
          case "$BUMP" in
            MAJOR)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              REVISION=""
              ;;
            MINOR)
              MINOR=$((MINOR + 1))
              PATCH=0
              REVISION=""
              ;;
            PATCH)
              PATCH=$((PATCH + 1))
              REVISION=""
              ;;
            REVISION)
              if [ -z "$REVISION" ]; then
                REVISION=0
              fi
              REVISION=$((REVISION + 1))
              ;;
          esac

          # Build new version string
          if [ -n "$REVISION" ]; then
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}.${REVISION}"
          else
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Bump type: $BUMP"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update manifest.json version
        run: |
          sed -i 's/"version": ".*"/"version": "${{ steps.version.outputs.new_version }}"/' custom_components/hakanban/manifest.json

      - name: Amend release commit
        run: |
          git add custom_components/hakanban/manifest.json
          git commit --amend -m "release: v${{ steps.version.outputs.new_version }}"
          git push --force-with-lease origin dev

      - name: Create tag
        run: |
          git tag -a "v${{ steps.version.outputs.new_version }}" -m "Release v${{ steps.version.outputs.new_version }}"
          git push origin "v${{ steps.version.outputs.new_version }}"

      - name: Merge dev to main
        run: |
          git checkout main
          git merge dev
          git push origin main

      - name: Create GitHub release
        run: |
          gh release create "v${{ steps.version.outputs.new_version }}" --title "v${{ steps.version.outputs.new_version }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
